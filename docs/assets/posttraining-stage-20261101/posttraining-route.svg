<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1430" viewBox="0 0 1680 1430" role="img" aria-labelledby="title desc">
<title id="title">Harness 引导的多无人机小模型后训练路线</title><desc id="desc">真实 Teacher 交互 → 执行感知的数据验证 → Student SFT → 回接评测；Agentic RL 作为条件分支。</desc>
<defs>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#566c83"/></marker>
<marker id="feedback" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#548e80"/></marker>
<marker id="optional" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#9275ad"/></marker>
</defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#1b3047}.edge-label{font-size:16px;fill:#465f76;paint-order:stroke;stroke:#fff;stroke-width:7px;stroke-linejoin:round}</style>
<rect width="100%" height="100%" fill="#fff"/>
<text x="38" y="48" font-size="30" font-weight="700">Harness 引导的多无人机小模型后训练路线</text>
<text x="38" y="80" font-size="17" font-weight="400" style="fill:#52677d">Harness-guided Small Language Model Post-training · 数据构建、监督迁移与条件式策略优化</text>
<rect x="38" y="102" width="20" height="20" rx="4" fill="#eef8f5" stroke="#548e80" stroke-width="1.6"/>
<text x="69" y="119" font-size="17" font-weight="400">证据与数据</text>
<rect x="308" y="102" width="20" height="20" rx="4" fill="#edf4fc" stroke="#507fac" stroke-width="1.6"/>
<text x="339" y="119" font-size="17" font-weight="400">模型与策略</text>
<rect x="578" y="102" width="20" height="20" rx="4" fill="#fff6e8" stroke="#b68b44" stroke-width="1.6"/>
<text x="609" y="119" font-size="17" font-weight="400">验证与评测</text>
<rect x="848" y="102" width="20" height="20" rx="4" fill="#f2f5f8" stroke="#8a99ac" stroke-width="1.6"/>
<text x="879" y="119" font-size="17" font-weight="400">环境与协议</text>
<rect x="1118" y="102" width="20" height="20" rx="4" fill="#f5f1fa" stroke="#9275ad" stroke-width="1.6"/>
<text x="1149" y="119" font-size="17" font-weight="400">训练与优化</text>
<g data-role="runtime">
<rect x="38" y="151" width="1604" height="137" rx="14" fill="#f2f5f8" stroke="#8a99ac" stroke-width="1.6"/>
<text x="58" y="186" font-size="22" font-weight="650">任务协议与独立划分 · 采集前冻结</text>
<text x="58" y="222" font-size="20" font-weight="400">决策职责、公开输入、工具权限、场景 / 种子 / 任务族、Harness 版本与执行预算</text>
<text x="58" y="249" font-size="20" font-weight="400">Train：采样与训练　｜　Dev：选择配置、分析错误与修订数据　｜　Test：模型与协议冻结后统一评价</text>
</g>
<text x="60" y="329" font-size="19" font-weight="650">WP1 / 执行感知的 Teacher 轨迹构建</text>
<g data-role="runtime">
<rect x="60" y="350" width="440" height="315" rx="14" fill="#f2f5f8" stroke="#8a99ac" stroke-width="1.6"/>
<text x="80" y="385" font-size="22" font-weight="650">共享 Harness 与多 UAV 环境</text>
<text x="80" y="421" font-size="19" font-weight="400">公开任务、局部观测与执行证据</text>
<text x="80" y="450" font-size="19" font-weight="400">计划契约、适用性门控与宏技能</text>
<text x="80" y="479" font-size="19" font-weight="400">工具执行、局部修复与模型接管</text>
<text x="80" y="508" font-size="19" font-weight="400">独立回合、时限、归档与请求预算</text>
<text x="80" y="537" font-size="19" font-weight="400">Teacher / Student 复用执行语义</text>
<text x="80" y="566" font-size="19" font-weight="400">私有状态仅供隔离评分 / 奖励</text>
</g>
<g data-role="decision">
<rect x="560" y="350" width="470" height="130" rx="14" fill="#edf4fc" stroke="#507fac" stroke-width="1.6"/>
<text x="580" y="385" font-size="22" font-weight="650">Teacher Agent · 真实交互</text>
<text x="580" y="421" font-size="19" font-weight="400">理解、规划、分配、工具与恢复决策</text>
<text x="580" y="448" font-size="19" font-weight="400">冻结模型身份、采样参数与调用预算</text>
</g>
<g data-role="evidence">
<rect x="560" y="535" width="470" height="130" rx="14" fill="#eef8f5" stroke="#548e80" stroke-width="1.6"/>
<text x="580" y="570" font-size="22" font-weight="650">回合轨迹与模型 I/O</text>
<text x="580" y="606" font-size="19" font-weight="400">消息顺序、调用 ID、并行关系与回执</text>
<text x="580" y="633" font-size="19" font-weight="400">模型决策 / Harness 内部执行分开</text>
</g>
<g data-role="verification">
<rect x="1090" y="350" width="490" height="315" rx="14" fill="#fff6e8" stroke="#b68b44" stroke-width="1.6"/>
<text x="1110" y="385" font-size="22" font-weight="650">Execution-aware Verification</text>
<text x="1110" y="421" font-size="19" font-weight="400">L1 结构：消息、Schema、调用关联</text>
<text x="1110" y="450" font-size="19" font-weight="400">L2 执行：参数、动作效果与重复</text>
<text x="1110" y="479" font-size="19" font-weight="400">L3 任务：隔离 Scorer 与义务满足</text>
<text x="1110" y="508" font-size="19" font-weight="400">L4 质量：冗余、恢复价值与可解释性</text>
<text x="1110" y="537" font-size="19" font-weight="400">保存质量标签、异常类型与筛选理由</text>
<text x="1110" y="566" font-size="19" font-weight="400">隐藏检查不进入模型输入与示范</text>
</g>
<path d="M470,288 L470,350" fill="none" stroke="#566c83" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M795,288 L795,350" fill="none" stroke="#566c83" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M500,409 L560,409" fill="none" stroke="#566c83" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="508" y="399" font-size="16" font-weight="400" class="edge-label">观测</text>
<path d="M560,454 L500,454" fill="none" stroke="#566c83" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="508" y="444" font-size="16" font-weight="400" class="edge-label">动作</text>
<path d="M795,480 L795,535" fill="none" stroke="#566c83" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="809" y="515" font-size="16" font-weight="400" class="edge-label">交互归档</text>
<path d="M1030,600 L1090,600" fill="none" stroke="#566c83" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g data-role="runtime">
<rect x="60" y="745" width="440" height="140" rx="14" fill="#f2f5f8" stroke="#8a99ac" stroke-width="1.6"/>
<text x="80" y="780" font-size="22" font-weight="650">失败、部分完成与排除记录</text>
<text x="80" y="816" font-size="18" font-weight="400">保留来源、质量标签及排除理由</text>
<text x="80" y="843" font-size="18" font-weight="400">用于诊断、纠错与任务设计</text>
<text x="80" y="870" font-size="18" font-weight="400">不默认混入正向 SFT 标签</text>
</g>
<g data-role="evidence">
<rect x="560" y="745" width="470" height="140" rx="14" fill="#eef8f5" stroke="#548e80" stroke-width="1.6"/>
<text x="580" y="780" font-size="22" font-weight="650">版本化决策数据集</text>
<text x="580" y="816" font-size="18" font-weight="400">成功 / 有效恢复 / 接管等能力标签</text>
<text x="580" y="843" font-size="18" font-weight="400">公开上下文 + 审核后的模型输出</text>
<text x="580" y="870" font-size="18" font-weight="400">训练 / 开发划分 · 输入预算 · Loss Mask</text>
</g>
<g data-role="training">
<rect x="1090" y="745" width="490" height="140" rx="14" fill="#f5f1fa" stroke="#9275ad" stroke-width="1.6"/>
<text x="1110" y="780" font-size="22" font-weight="650">WP2 / 约 2B Student SFT</text>
<text x="1110" y="816" font-size="18" font-weight="400">只监督有效 assistant 决策与工具调用</text>
<text x="1110" y="843" font-size="18" font-weight="400">模板适配、参数高效微调与检查点导出</text>
<text x="1110" y="870" font-size="18" font-weight="400">环境回执和技能内部动作不作生成标签</text>
</g>
<path d="M1210,665 L1210,694 L280,694 L280,745" fill="none" stroke="#566c83" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="610" y="686" font-size="16" font-weight="400" class="edge-label">分流与追溯</text>
<path d="M1400,665 L1400,715 L795,715 L795,745" fill="none" stroke="#566c83" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="1040" y="708" font-size="16" font-weight="400" class="edge-label">验证通过的决策样本</text>
<path d="M1030,815 L1090,815" fill="none" stroke="#566c83" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="60" y="945" font-size="19" font-weight="650">回接、验证与策略优化</text>
<g data-role="decision">
<rect x="1090" y="970" width="490" height="140" rx="14" fill="#edf4fc" stroke="#507fac" stroke-width="1.6"/>
<text x="1110" y="1005" font-size="22" font-weight="650">Student 回接同一 Harness</text>
<text x="1110" y="1041" font-size="18" font-weight="400">模型替换；固定公开权限与技能语义</text>
<text x="1110" y="1068" font-size="18" font-weight="400">多轮工具调用、异常处理与停止判断</text>
<text x="1110" y="1095" font-size="18" font-weight="400">导出模型 / Adapter 与推理配置留档</text>
</g>
<g data-role="verification">
<rect x="560" y="970" width="470" height="140" rx="14" fill="#fff6e8" stroke="#b68b44" stroke-width="1.6"/>
<text x="580" y="1005" font-size="22" font-weight="650">开发集验证与错误分析</text>
<text x="580" y="1041" font-size="18" font-weight="400">同 Harness：基座 vs SFT</text>
<text x="580" y="1068" font-size="18" font-weight="400">任务成功、工具正确性、恢复与成本</text>
<text x="580" y="1095" font-size="18" font-weight="400">检查输入、标签、分布偏移与策略回归</text>
</g>
<g data-role="verification">
<rect x="60" y="970" width="440" height="140" rx="14" fill="#fff6e8" stroke="#b68b44" stroke-width="1.6"/>
<text x="80" y="1005" font-size="22" font-weight="650">RL 准入：奖励、采样与成本</text>
<text x="80" y="1041" font-size="18" font-weight="400">可用 SFT 起点与有效交互信号</text>
<text x="80" y="1068" font-size="18" font-weight="400">奖励语义、回合隔离与反例检验</text>
<text x="80" y="1095" font-size="18" font-weight="400">训练器适配、吞吐与预算可承担</text>
</g>
<path d="M1335,885 L1335,970" fill="none" stroke="#566c83" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="1348" y="933" font-size="16" font-weight="400" class="edge-label">导出与部署</text>
<path d="M1090,1040 L1030,1040" fill="none" stroke="#566c83" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M560,1040 L500,1040" fill="none" stroke="#9275ad" stroke-width="2" stroke-linejoin="round" marker-end="url(#optional)" stroke-dasharray="7 5"/>
<path d="M760,970 L760,924 L535,924 L535,815 L560,815" fill="none" stroke="#548e80" stroke-width="2" stroke-linejoin="round" marker-end="url(#feedback)" stroke-dasharray="7 5"/>
<text x="557" y="918" font-size="16" font-weight="400" class="edge-label">仅开发集诊断回流</text>
<g data-role="training">
<rect x="60" y="1190" width="440" height="140" rx="14" fill="#f5f1fa" stroke="#9275ad" stroke-width="1.6" stroke-dasharray="8 5"/>
<text x="80" y="1225" font-size="22" font-weight="650">WP3 / Agentic RL · 条件分支</text>
<text x="80" y="1261" font-size="18" font-weight="400">Student rollout ↔ 隔离奖励 ↔ 更新</text>
<text x="80" y="1288" font-size="18" font-weight="400">仅优化真实模型生成的决策序列</text>
<text x="80" y="1315" font-size="18" font-weight="400">与固定 SFT 起点对照</text>
</g>
<g data-role="verification">
<rect x="560" y="1190" width="1020" height="140" rx="14" fill="#fff6e8" stroke="#b68b44" stroke-width="1.6"/>
<text x="580" y="1225" font-size="22" font-weight="650">WP4 / 冻结后的统一评估与贡献归因</text>
<text x="580" y="1261" font-size="18" font-weight="400">基座 / SFT / SFT+RL（如开展）· 同 Harness · 新独立测试 · 关键系统与数据消融</text>
<text x="580" y="1288" font-size="18" font-weight="400">主指标：端到端任务成功；同时报告工具正确性、恢复、泛化、token、时间、动作与训练成本</text>
<text x="580" y="1315" font-size="18" font-weight="400">Test 不参与数据生成、样本筛选、调参与反复选择；各模型使用相同初态与评估协议</text>
</g>
<path d="M280,1110 L280,1190" fill="none" stroke="#9275ad" stroke-width="2" stroke-linejoin="round" marker-end="url(#optional)" stroke-dasharray="7 5"/>
<text x="293" y="1159" font-size="16" font-weight="400" class="edge-label">通过准入后</text>
<path d="M795,1110 L795,1190" fill="none" stroke="#566c83" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="810" y="1159" font-size="16" font-weight="400" class="edge-label">SFT 路径可直接交付</text>
<path d="M500,1260 L560,1260" fill="none" stroke="#9275ad" stroke-width="2" stroke-linejoin="round" marker-end="url(#optional)" stroke-dasharray="7 5"/>
<path d="M60,1385 L126,1385" fill="none" stroke="#566c83" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="140" y="1391" font-size="17" font-weight="400">核心研究路线</text>
<path d="M430,1385 L496,1385" fill="none" stroke="#548e80" stroke-width="2" stroke-linejoin="round" marker-end="url(#feedback)" stroke-dasharray="7 5"/>
<text x="510" y="1391" font-size="17" font-weight="400">开发反馈与数据修订</text>
<path d="M900,1385 L966,1385" fill="none" stroke="#9275ad" stroke-width="2" stroke-linejoin="round" marker-end="url(#optional)" stroke-dasharray="7 5"/>
<text x="980" y="1391" font-size="17" font-weight="400">条件式 RL 路径</text>
<text x="1270" y="1391" font-size="17" font-weight="600">能力迁移优先通过 SFT 实现</text></svg>