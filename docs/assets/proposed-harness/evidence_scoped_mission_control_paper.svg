<svg xmlns="http://www.w3.org/2000/svg" width="540pt" height="418pt" viewBox="0 0 540 418" role="img" aria-labelledby="title desc">
  <title id="title">Proposed evidence-scoped multi-UAV harness</title>
  <desc id="desc">Mission obligations and scoped public evidence are reconciled to identify localization, action, or confirmation gaps. A fleet controller selects bounded UAV operations. Actual API results return to the evidence record; hidden scoring stays outside the online agent.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3572B4"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#168778"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B47912"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7E59A3"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17212F; }
      .head { font-size: 9.2px; font-weight: 700; letter-spacing: .25px; }
      .body { font-size: 8.6px; }
      .small { font-size: 7.8px; }
      .main { font-size: 10px; font-weight: 700; }
      .arrow { fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .box { stroke-width: 1.2; rx: 9; }
    </style>
  </defs>

  <rect x="0" y="0" width="540" height="418" fill="white"/>
  <text x="270" y="20" text-anchor="middle" style="font-size:11.5px;font-weight:700">Proposed Evidence-Scoped Multi-UAV Harness</text>

  <rect class="box" x="18" y="39" width="231" height="72" fill="#EDF5FF" stroke="#80AADE"/>
  <text class="head" x="133.5" y="57" text-anchor="middle" fill="#244E7E">MISSION OBLIGATIONS</text>
  <text class="body" x="133.5" y="74" text-anchor="middle">source-linked actor · object · action</text>
  <text class="body" x="133.5" y="89" text-anchor="middle">order · end condition · unresolved text</text>

  <rect class="box" x="291" y="39" width="231" height="72" fill="#ECF9F6" stroke="#69B7A9"/>
  <text class="head" x="406.5" y="57" text-anchor="middle" fill="#0D6C60">SCOPED PUBLIC EVIDENCE</text>
  <text class="body" x="406.5" y="74" text-anchor="middle">scene/task log · source · UAV · time</text>
  <text class="body" x="406.5" y="89" text-anchor="middle">ID/position | path contact | actual effect</text>

  <path class="arrow" d="M133 111 L211 141" stroke="#3572B4" marker-end="url(#arrow-blue)"/>
  <path class="arrow" d="M407 111 L329 141" stroke="#168778" marker-end="url(#arrow-teal)"/>
  <rect class="box" x="113" y="143" width="314" height="67" fill="#FFF3D4" stroke="#D5A548"/>
  <text class="main" x="270" y="162" text-anchor="middle">Obligation–evidence reconciliation</text>
  <text class="body" x="270" y="179" text-anchor="middle">What is known? Who acted? What is proven?</text>
  <text x="270" y="197" text-anchor="middle" style="font-size:9px;font-weight:700;fill:#8A5E0B">LOCATE  |  ACT  |  CONFIRM  |  UNKNOWN</text>

  <path class="arrow" d="M270 210 L270 226 L100 226 L100 241" stroke="#B47912" marker-end="url(#arrow-amber)"/>
  <path class="arrow" d="M270 210 L270 241" stroke="#B47912" marker-end="url(#arrow-amber)"/>
  <path class="arrow" d="M270 226 L440 226 L440 241" stroke="#B47912" marker-end="url(#arrow-amber)"/>
  <text class="small" x="408" y="218" text-anchor="middle" fill="#77540D">time · battery · API cost</text>

  <rect class="box" x="18" y="243" width="164" height="57" fill="#F4ECFA" stroke="#AB8BCB"/>
  <text class="head" x="100" y="263" text-anchor="middle" fill="#66468A">LOCALIZE TARGET</text>
  <text class="body" x="100" y="281" text-anchor="middle">auxiliary UAVs; bounded search</text>
  <rect class="box" x="188" y="243" width="164" height="57" fill="#F4ECFA" stroke="#AB8BCB"/>
  <text class="head" x="270" y="263" text-anchor="middle" fill="#66468A">EXECUTE OBLIGATION</text>
  <text class="body" x="270" y="281" text-anchor="middle">required UAV; original order</text>
  <rect class="box" x="358" y="243" width="164" height="57" fill="#F4ECFA" stroke="#AB8BCB"/>
  <text class="head" x="440" y="263" text-anchor="middle" fill="#66468A">CHECK PUBLIC STATE</text>
  <text class="body" x="440" y="281" text-anchor="middle">actual receipt; abstain if unknown</text>

  <path class="arrow" d="M100 300 L100 313 L222 313 L222 327" stroke="#7E59A3" marker-end="url(#arrow-purple)"/>
  <path class="arrow" d="M270 300 L270 327" stroke="#7E59A3" marker-end="url(#arrow-purple)"/>
  <path class="arrow" d="M440 300 L440 313 L318 313 L318 327" stroke="#7E59A3" marker-end="url(#arrow-purple)"/>
  <rect class="box" x="153" y="329" width="234" height="34" fill="#EBDDF6" stroke="#9976C0"/>
  <text class="body" x="270" y="350" text-anchor="middle" style="font-weight:700">Per-UAV queues + typed tools</text>
  <path class="arrow" d="M270 363 L270 375" stroke="#7E59A3" marker-end="url(#arrow-purple)"/>

  <rect class="box" x="153" y="377" width="234" height="34" fill="#EBDDF6" stroke="#9976C0"/>
  <text class="body" x="270" y="398" text-anchor="middle">Agent-visible UAV API: sense · act · progress</text>

  <path class="arrow" d="M387 394 L531 394 L531 75 L522 75" stroke="#168778" marker-end="url(#arrow-teal)"/>
  <text class="small" x="487" y="373" text-anchor="middle" fill="#0D6C60">real result</text>
  <rect x="18" y="377" width="121" height="34" rx="9" fill="#F7F8FA" stroke="#98A3B3" stroke-width="1.1" stroke-dasharray="4 3"/>
  <text class="small" x="78.5" y="390" text-anchor="middle">Hidden checker</text>
  <text class="small" x="78.5" y="402" text-anchor="middle">external scoring only</text>
</svg>
