<rect x="850" y="375" width="756" height="106" rx="14" fill="#edf4fc" stroke="#507fac" stroke-width="1.6"/>
<text x="870" y="410" font-size="22" font-weight="650" text-anchor="start">模型显式提交 → 计划契约 DecisionFrame</text>
