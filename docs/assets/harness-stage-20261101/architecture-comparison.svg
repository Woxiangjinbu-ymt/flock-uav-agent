<text x="870" y="597" font-size="19" font-weight="400" text-anchor="start">有效则继续或局部修复；依赖失效、效果不明或耗尽则交回</text>
</g>
<g data-role="decision">
<rect x="850" y="675" width="756" height="106" rx="14" fill="#edf4fc" stroke="#507fac" stroke-width="1.6"/>
